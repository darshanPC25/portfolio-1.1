# Local PostgreSQL for development.
# Copy .env.example to .env (gitignored) in this folder first, then run:
#   docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Host port is configurable in case a local PostgreSQL already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portfolio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-pgdata:
