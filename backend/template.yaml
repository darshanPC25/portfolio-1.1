AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Darshan portfolio backend - Spring Boot on AWS Lambda (Java 21, SnapStart)
  behind an API Gateway HTTP API. Database: Neon PostgreSQL. The Vercel frontend
  proxies /api/* here. Build first:  ./mvnw -Plambda package -DskipTests

# Secrets are NoEcho parameters: never shown in the console's parameter view or in
# CloudFormation output. They become encrypted Lambda environment variables.
Parameters:
  DbUrl:
    Type: String
    Description: Neon POOLED JDBC URL, e.g. jdbc:postgresql://ep-xxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0
  DbMigrationUrl:
    Type: String
    Description: Neon DIRECT JDBC URL (same, without "-pooler") - used only for Flyway migrations
  DbUsername:
    Type: String
    Description: Neon role name
  DbPassword:
    Type: String
    NoEcho: true
    Description: Neon role password
  SiteUrl:
    Type: String
    Description: Public site address on Vercel, no trailing slash, e.g. https://darshan-portfolio.vercel.app
  ContactIpHashSalt:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Long random string used to hash contact-form IP addresses
  AdminEmail:
    Type: String
    Default: ''
    Description: First Studio administrator (used once, while none exists)
  AdminPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: First administrator's password, 12-64 characters. Clear it after the first deploy.
  MailHost:
    Type: String
    Default: ''
    Description: SMTP host for contact form emails, e.g. smtp.gmail.com (optional)
  MailPort:
    Type: String
    Default: '587'
  MailUsername:
    Type: String
    Default: ''
  MailPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: SMTP password (for Gmail an app password)
  MailFrom:
    Type: String
    Default: ''
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional GitHub token (no scopes) for the contribution graph

Resources:
  PortfolioApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Caps traffic (and cost) if the API is ever flooded.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  PortfolioFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/portfolio-backend
      RetentionInDays: 30

  PortfolioFunction:
    Type: AWS::Serverless::Function
    DependsOn: PortfolioFunctionLogs
    Properties:
      FunctionName: portfolio-backend
      Description: Darshan portfolio REST API (Spring Boot)
      CodeUri: target/portfolio-backend-lambda.zip
      Handler: com.darshanpc.portfolio.lambda.StreamLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - arm64
      # More memory also means more CPU: faster start-up and responses.
      MemorySize: 2048
      # API Gateway waits at most 30 seconds.
      Timeout: 29
      # SnapStart: Spring starts (and Flyway migrates) once when a version is published;
      # cold starts then restore that snapshot in about a second.
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: prod,lambda
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
          DB_URL: !Ref DbUrl
          DB_MIGRATION_URL: !Ref DbMigrationUrl
          DB_USERNAME: !Ref DbUsername
          DB_PASSWORD: !Ref DbPassword
          CORS_ALLOWED_ORIGINS: !Ref SiteUrl
          CONTACT_IP_HASH_SALT: !Ref ContactIpHashSalt
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_PASSWORD: !Ref AdminPassword
          ADMIN_DISPLAY_NAME: Darshan
          MAIL_HOST: !Ref MailHost
          MAIL_PORT: !Ref MailPort
          MAIL_USERNAME: !Ref MailUsername
          MAIL_PASSWORD: !Ref MailPassword
          MAIL_FROM: !Ref MailFrom
          GITHUB_TOKEN: !Ref GitHubToken
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Backend address. Put it into frontend/vercel.json with  node scripts/set-api-origin.mjs <ApiUrl>
    Value: !Sub https://${PortfolioApi}.execute-api.${AWS::Region}.amazonaws.com
  HealthCheck:
    Description: Should return {"status":"UP"}
    Value: !Sub https://${PortfolioApi}.execute-api.${AWS::Region}.amazonaws.com/actuator/health
