# Shared configuration for every environment.
# Secrets and connection details come from environment variables or a
# local, gitignored backend/.env file — never from this file.

spring:
  application:
    name: portfolio-backend
  config:
    import: optional:file:.env[.properties]
  # Sessions use the servlet container unless portfolio.session-store=jdbc (see JdbcSessionConfig).
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  profiles:
    default: dev

  datasource:
    # HikariCP connection pool. A personal site needs few connections; keep the
    # total across all instances well below PostgreSQL's max_connections (100).
    hikari:
      pool-name: portfolio-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000     # ms
      idle-timeout: 600000          # ms (10 min)
      max-lifetime: 1800000         # ms (30 min)

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        # Loads lazy collections (project tags, skills of each category, …) in
        # batches with IN (...) instead of one query per row (N+1).
        default_batch_fetch_size: 32
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false

  # Outgoing email (contact form notifications) through the owner's own mailbox.
  # Credentials only ever come from the environment / backend/.env.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      # Port 587: upgrade to TLS and refuse to send without it. Port 465: set MAIL_SSL=true.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:11MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # gzip JSON responses (the full portfolio is ~20 kB, ~4 kB compressed).
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1KB
  error:
    include-stacktrace: never
    include-message: never
  # Set to "framework" when running behind a trusted reverse proxy so the
  # client IP used for rate limiting comes from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Admin sessions: server-side, cookie unreadable by scripts and never sent cross-site.
  servlet:
    session:
      timeout: ${ADMIN_SESSION_TIMEOUT:2h}
      cookie:
        name: PORTFOLIO_SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}   # set true when served over HTTPS

management:
  health:
    # Never let the mail server's availability decide whether the app is "UP".
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API documentation is switched on per environment (see application-dev.yml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  publication:
    # Publish the seeded content once if nothing has ever been published.
    bootstrap-on-startup: true
  contact:
    rate-limit:
      max-requests: ${CONTACT_RATE_LIMIT_MAX:5}
      window: ${CONTACT_RATE_LIMIT_WINDOW:10m}
    # Salt for hashing sender IP addresses. A random salt is used when empty.
    ip-hash-salt: ${CONTACT_IP_HASH_SALT:}
  admin:
    # First administrator, created once while no administrator exists.
    # Remove ADMIN_PASSWORD from the environment after the first start.
    bootstrap:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Administrator}
    login-rate-limit:
      max-requests: ${ADMIN_LOGIN_RATE_LIMIT_MAX:10}
      window: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW:15m}
    max-failed-attempts: 5
    lock-duration: 15m
  mail:
    # Address messages are sent from; defaults to MAIL_USERNAME.
    from: ${MAIL_FROM:}
    # Send in the background (true) or before the response (false, required on Lambda).
    async: ${MAIL_ASYNC:true}
  # Where Studio sessions and rate-limit counters live: memory (one instance) or jdbc (PostgreSQL).
  session-store: ${SESSION_STORE:memory}
  rate-limit-store: ${RATE_LIMIT_STORE:memory}
  github:
    # Optional. Any GitHub token (no scopes needed): raises GitHub's rate limit and
    # enables the contribution calendar in the GitHub section.
    token: ${GITHUB_TOKEN:}
    cache-ttl: ${GITHUB_CACHE_TTL:30m}
  storage:
    # local: files on disk (UPLOAD_DIRECTORY). database: bytes in PostgreSQL (serverless hosting).
    type: ${STORAGE_TYPE:local}
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
    max-image-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}
    max-document-size: ${UPLOAD_MAX_DOCUMENT_SIZE:10MB}
